name: Administrador
on:
  push:
    branches: [feat/administrador]
  pull_request:
    paths: ['apps/administrador/**', 'packages/admin_data/**', 'apps/operador/lib/**', 'packages/mule_data/**', '.github/workflows/administrador.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: administrador-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Test shared Operator data
        working-directory: packages/mule_data
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Test Administrator data
        working-directory: packages/admin_data
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Operator regression tests
        working-directory: apps/operador
        run: |
          flutter pub get
          flutter analyze
          flutter test --timeout=120s
      - name: Administrator interoperability and interface tests
        working-directory: apps/administrador
        run: |
          flutter pub get
          flutter analyze
          flutter test --timeout=120s
      - name: Preserve Administrator development signing identity
        uses: actions/cache@v4
        with:
          path: .signing/administrador-debug.keystore
          key: administrador-development-signing-v1
      - name: Prepare Administrator keystore
        shell: bash
        run: |
          mkdir -p .signing
          if [ ! -f .signing/administrador-debug.keystore ]; then
            keytool -genkeypair -noprompt -keystore .signing/administrador-debug.keystore \
              -storetype JKS -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=MuleAgent Administrator Development, O=MuleAgent, C=DO"
          fi
      - name: Build Administrator APK
        working-directory: apps/administrador
        env:
          MULEAGENT_DEBUG_KEYSTORE: ${{ github.workspace }}/.signing/administrador-debug.keystore
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: administrador-debug
          path: apps/administrador/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Publish Administrator APK and ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/administrador'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('MuleAgent-Administrador-1.0.1.zip','w',ZIP_DEFLATED,compresslevel=6) as output:
              output.write('apps/administrador/build/app/outputs/flutter-apk/app-debug.apk','MuleAgent-Administrador-1.0.1.apk')
          PY
          admin_tag="administrador-v1.0.1-${GITHUB_SHA:0:7}"
          gh release create "$admin_tag" \
            "apps/administrador/build/app/outputs/flutter-apk/app-debug.apk#MuleAgent-Administrador-1.0.1.apk" \
            "MuleAgent-Administrador-1.0.1.zip" \
            --prerelease --target "$GITHUB_SHA" \
            --title "MuleAgent Administrador 1.0.1 · prueba de campo" \
            --notes-file docs/administrador-v1.0.md
