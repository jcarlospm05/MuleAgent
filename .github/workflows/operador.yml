name: Operador
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: operador-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Shared data dependencies
        working-directory: packages/mule_data
        run: dart pub get
      - name: Data analysis and tests
        working-directory: packages/mule_data
        run: |
          dart analyze
          dart test
      - name: Operator dependencies
        working-directory: apps/operador
        run: flutter pub get
      - name: Operator analysis and tests
        working-directory: apps/operador
        run: |
          flutter analyze
          flutter test --timeout=120s
      - name: Preserve development signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: operador-development-signing-v1
      - name: Build development APK
        working-directory: apps/operador
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: operador-debug
          path: apps/operador/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Publish installable APK for field testing
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/operador-base'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          operator_version=$(python -c "from pathlib import Path; print(next(line.split()[1].split('+')[0] for line in Path('apps/operador/pubspec.yaml').read_text().splitlines() if line.startswith('version:')))")
          export OPERATOR_VERSION="$operator_version"
          python - <<'PYZIP'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import os
          version = os.environ['OPERATOR_VERSION']
          archive = Path(f'MuleAgent-Operador-{version}.zip')
          with ZipFile(archive, 'w', compression=ZIP_DEFLATED, compresslevel=6) as output:
              output.write('apps/operador/build/app/outputs/flutter-apk/app-debug.apk', f'MuleAgent-Operador-{version}.apk')
          PYZIP
          operator_tag="operador-v${operator_version}-${GITHUB_SHA:0:7}"
          gh release create "$operator_tag" \
            "apps/operador/build/app/outputs/flutter-apk/app-debug.apk#MuleAgent-Operador-${operator_version}.apk" \
            "MuleAgent-Operador-${operator_version}.zip" \
            --prerelease --target "$GITHUB_SHA" \
            --title "MuleAgent Operador ${operator_version} · prueba de campo" \
            --notes-file docs/operador-v1.0.md
