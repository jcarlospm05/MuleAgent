name: Operador
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: operador-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Shared data dependencies
        working-directory: packages/mule_data
        run: dart pub get
      - name: Data analysis and tests
        working-directory: packages/mule_data
        run: |
          dart analyze
          dart test
      - name: Operator dependencies
        working-directory: apps/operador
        run: flutter pub get
      - name: Operator analysis and tests
        working-directory: apps/operador
        run: |
          flutter analyze
          flutter test --timeout=120s
      - name: Preserve development signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: operador-development-signing-v1
      - name: Build development APK
        working-directory: apps/operador
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: operador-debug
          path: apps/operador/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Publish installable APK for field testing
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/operador-base'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          operator_tag="operador-v1.0.0-${GITHUB_SHA:0:7}"
          gh release create "$operator_tag" \
            "apps/operador/build/app/outputs/flutter-apk/app-debug.apk#MuleAgent-Operador-1.0.0.apk" \
            --prerelease --target "$GITHUB_SHA" \
            --title "MuleAgent Operador 1.0.0 · prueba de campo" \
            --notes-file docs/operador-v1.0.md
