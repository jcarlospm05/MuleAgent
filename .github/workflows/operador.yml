name: Operador
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operador-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Shared data dependencies
        working-directory: packages/mule_data
        run: dart pub get
      - name: Data analysis and tests
        working-directory: packages/mule_data
        run: |
          dart analyze
          dart test
      - name: Operator dependencies
        working-directory: apps/operador
        run: flutter pub get
      - name: Operator analysis and tests
        working-directory: apps/operador
        run: |
          flutter analyze
          flutter test --timeout=60s
      - name: Build development APK
        working-directory: apps/operador
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: operador-debug
          path: apps/operador/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
