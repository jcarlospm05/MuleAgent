version: 1.0.0+2
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  mule_data:
    path: ../../packages/mule_data
  sqflite_sqlcipher: ^3.4.0
  flutter_secure_storage: ^9.2.4
  path: ^1.9.1
  uuid: ^4.5.1
  image_picker: ^1.2.1
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  cross_file: ^0.3.5
